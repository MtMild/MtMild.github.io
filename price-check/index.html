<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Store Price Check</title>
<link rel="stylesheet" href="lib/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Price Check">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#141414">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: one-column handheld app, sticky top bar with back arrow, big tiles on home, scan screen = mode switch + input + camera + result */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#ececf0; --line:#e3e3e8;
  --ink:#111111; --ink-2:#515154; --ink-3:#86868b;
  --accent:#111111; --accent-ink:#ffffff; --accent-soft:#ececf0;
  --promo:#9a6a2a; --promo-soft:#f5ede1;
  --future:#0066cc; --future-soft:#e6f0fb;
  --oos:#b3261e; --oos-soft:#fbe9e7;
  --ok:#1f7a4a; --ok-soft:#e5f3ea;
  --demo:#8a6a1f; --demo-soft:#f7f0de;
  --gold:#b08d57;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.06);
  --f-display:"Inter",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --f-serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#323236;
  --ink:#f5f5f7; --ink-2:#c7c7cc; --ink-3:#8e8e93;
  --accent:#f5f5f7; --accent-ink:#000000; --accent-soft:#2c2c2e;
  --promo:#d8b47a; --promo-soft:#2e2517;
  --future:#2997ff; --future-soft:#0f2236;
  --oos:#ff6b5e; --oos-soft:#3a1714;
  --ok:#4cd17f; --ok-soft:#10291a;
  --demo:#e2c37e; --demo-soft:#2b2414;
  --gold:#c9a66b;
  --shadow:0 1px 1px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#323236;
  --ink:#f5f5f7; --ink-2:#c7c7cc; --ink-3:#8e8e93;
  --accent:#f5f5f7; --accent-ink:#000000; --accent-soft:#2c2c2e;
  --promo:#d8b47a; --promo-soft:#2e2517;
  --future:#2997ff; --future-soft:#0f2236;
  --oos:#ff6b5e; --oos-soft:#3a1714;
  --ok:#4cd17f; --ok-soft:#10291a;
  --demo:#e2c37e; --demo-soft:#2b2414;
  --gold:#c9a66b;
  --shadow:0 1px 1px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:60px;padding-block:6px}
.back{width:48px;height:48px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;margin-left:-8px}
.back:hover{background:var(--surface-2)}
.back svg{width:26px;height:26px}
.bar h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.store{font-size:12px;color:var(--ink-3);text-align:right;line-height:1.2}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--demo-soft);color:var(--demo);padding:4px 8px;border-radius:999px;white-space:nowrap}

main{padding-block:16px 40px}
.view{display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left}
.tile svg{width:30px;height:30px;color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1}
.tile small{color:var(--ink-3);font-size:13px}
.tile.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:transparent;flex-direction:row;align-items:center;min-height:96px}
.tile.primary svg{color:var(--accent-ink);width:40px;height:40px;flex:none}
.tile.primary small{color:inherit;opacity:.85}
.tile.soon{background:transparent;box-shadow:none;border-style:dashed;cursor:default;min-height:84px}
.tile.soon svg{color:var(--ink-3)}
.tile.soon b{font-size:17px;color:var(--ink-2)}
.soon-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.old{font-family:var(--f-mono);font-size:11px;color:inherit;opacity:.6}

/* segmented mode */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* scan input */
.scanbox{display:flex;gap:8px;align-items:stretch}
.field{flex:1;min-width:0;position:relative}
.field input{width:100%;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px 0 46px;font-family:var(--f-mono);font-size:18px;letter-spacing:.02em}
.field input:focus{border-color:var(--accent);outline:none}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--ink-3);pointer-events:none}
.iconbtn{min-width:56px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--ink-3);margin:-8px 2px 0}
.ready{display:inline-flex;align-items:center;gap:6px}
.ready::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{min-height:64px;font-size:19px;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* camera */
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.vf{position:absolute;inset:0;pointer-events:none}
.vf .win{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.vf .win::before,.vf .win::after{content:"";position:absolute;inset:-3px;border:3px solid #fff;border-radius:12px;clip-path:polygon(0 0,22% 0,22% 100%,78% 100%,78% 0,100% 0,100% 100%,0 100%)}
.vf .laser{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff5a4a;box-shadow:0 0 8px #ff5a4a;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.vf .laser{animation:none}}
.cam .camtag{position:absolute;left:10px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px}
.cam.flash .win::before{border-color:#4ade80}
.notice{border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.notice.warn{background:var(--demo-soft);border-color:transparent;color:var(--ink)}
.notice b{font-weight:700}
.notice p{margin:0;font-size:14px;color:var(--ink-2)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .ic{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center}
.li .ic svg{width:24px;height:24px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--ink-3);font-size:13px}
.li .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .p s{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.empty{padding:18px;color:var(--ink-3);font-size:14px;text-align:center}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.promo{background:var(--promo-soft);color:var(--promo)}
.chip.future{background:var(--future-soft);color:var(--future)}
.chip.oos{background:var(--oos-soft);color:var(--oos)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mini{font-size:11px;padding:2px 7px}

/* result card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card .stripe{height:8px;background:var(--ok)}
.card.is-promo .stripe{background:var(--promo)}
.card.is-oos .stripe{background:var(--oos)}
.card.is-future .stripe{background:linear-gradient(90deg,var(--ok) 0 50%,var(--future) 50%)}
.card.is-promo.is-future .stripe{background:linear-gradient(90deg,var(--promo) 0 50%,var(--future) 50%)}
.cbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;gap:14px;align-items:flex-start}
.photo{width:84px;height:84px;flex:none;border-radius:14px;display:grid;place-items:center}
.photo svg{width:48px;height:48px}
.head .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.head h2{font-family:var(--f-display);font-size:26px;line-height:1.08;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--ink-2)}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price .now{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.is-promo .price .now{color:var(--promo)}
.price s{font-size:22px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.p3 div{background:var(--surface);padding:10px 12px;min-width:0}
.p3 small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.p3 b{font-size:18px;font-variant-numeric:tabular-nums}
.p3 .cur{box-shadow:inset 0 -3px 0 var(--accent)}
.p3 em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.ticket .was{font-size:18px;color:#666;text-decoration:line-through}
.price .lab{width:100%;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.box{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.box svg{width:22px;height:22px;flex:none}
.box div{min-width:0}
.box b{display:block}
.box small{font-size:13px;opacity:.85}
.box.promo{background:var(--promo-soft);color:var(--promo)}
.box.future{background:var(--future-soft);color:var(--future)}
.box.oos{background:var(--oos-soft);color:var(--oos)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.stock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stock div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stock b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stock small{font-size:12px;color:var(--ink-2)}
.stock .zero b{color:var(--oos)}
.others{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.others span{display:flex;justify-content:space-between;gap:8px}

/* ticket */
.ticket-wrap{background:var(--surface-2);border-radius:var(--r);padding:20px 16px;display:flex;justify-content:center}
.ticket{width:100%;max-width:260px;background:#fff;color:#111;border-radius:6px;padding:14px 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;font-family:var(--f-body)}
.ticket::before{content:"";position:absolute;top:8px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.ticket .tn{margin-top:14px;font-weight:700;font-size:15px;line-height:1.2}
.ticket .tm{font-size:11px;color:#555}
.ticket .tp{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;margin:6px 0 2px}
.ticket svg.bc{width:100%;height:auto;display:block}
.ticket .wm{position:absolute;right:8px;top:10px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#a16207;border:1px solid #a16207;padding:1px 5px;border-radius:4px}

/* test barcodes */
.bcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bccard{background:#fff;color:#111;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.bccard b{font-size:14px}
.bccard small{font-size:12px;color:#555}
.bccard svg{width:100%;height:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast svg{width:22px;height:22px;flex:none}
.notfound{text-align:center;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.notfound svg{width:44px;height:44px;color:var(--oos)}
.notfound h2{font-family:var(--f-display);margin:0;font-size:24px}
.notfound p{margin:0;color:var(--ink-2)}
.form{display:flex;flex-direction:column;gap:12px}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ff span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ff input,.ff select{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:17px;width:100%}
.ff input:focus,.ff select:focus{border-color:var(--accent);outline:none}
.ff2{display:flex;gap:10px}
.foot{font-size:12px;color:var(--ink-3);text-align:center;padding-top:8px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.primary{grid-column:span 3}}

/* ---- look: Apple-style clarity (system type, soft grey canvas, glass bar, pill controls) + luxury-boutique accents (black, gold hairlines, serif item names, spaced capitals) ---- */
body{letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.bar{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar h1{font-family:var(--f-body);font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.back{border-radius:999px}
main{padding-block:24px 56px}
.view{gap:20px}
.label{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--ink-3)}
.tiles{gap:14px}
.tile{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;gap:12px;transition:transform .15s ease}
.tile:active{transform:scale(.98)}
.tile svg{color:var(--ink);width:28px;height:28px;stroke-width:1.6}
.tile b{font-family:var(--f-body);font-weight:600;font-size:19px;letter-spacing:-.02em}
.tile.primary{background:var(--accent);color:var(--accent-ink);min-height:120px;padding:24px;position:relative;overflow:hidden}
.tile.primary::after{content:"";position:absolute;left:24px;right:24px;bottom:14px;height:1px;background:var(--gold);opacity:.8}
.tile.primary b{font-family:var(--f-serif);font-weight:500;font-size:28px;letter-spacing:0}
.tile.primary svg{color:var(--gold)}
.tile.soon{border:1px solid var(--line);opacity:.7}
.tile.soon b{font-size:15px}
.seg{border-radius:999px;background:var(--surface-2)}
.seg button{border-radius:999px;font-weight:500}
.btn{border-radius:999px;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.big{font-family:var(--f-body);font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;min-height:58px}
.field input,.ff input,.ff select{border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.field input:focus,.ff input:focus,.ff select:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 8%,transparent)}
.ff span{font-size:11px;letter-spacing:.16em}
.notice{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.list{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.li{min-height:68px;padding:10px 16px}
.li .t b{font-family:var(--f-serif);font-weight:500;font-size:18px;letter-spacing:0}
.chip{font-weight:500;letter-spacing:.02em}
.card{border:0;border-radius:24px;box-shadow:var(--shadow)}
.card .stripe{height:3px}
.cbody{padding:22px;gap:18px}
.head h2{font-family:var(--f-serif);font-weight:500;font-size:32px;letter-spacing:0;line-height:1.05}
.head .meta{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--ink-3)}
.price{padding-top:14px;border-top:1px solid var(--gold)}
.price .now{font-family:var(--f-body);font-weight:600;font-size:52px;letter-spacing:-.03em}
.price .lab{letter-spacing:.2em;font-size:11px}
.p3{border:0;background:var(--line);border-radius:16px}
.p3 small{letter-spacing:.16em;font-size:10px}

:root{--glass:rgba(255,255,255,.62);--glass-rim:rgba(255,255,255,.9);--glass-edge:rgba(0,0,0,.08);--glass-press:rgba(0,0,0,.08);--glass-ink:#111}

.dock,.fab,.btn:not(.primary){background:var(--glass);color:var(--glass-ink);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 .5px var(--glass-edge),0 8px 24px rgba(0,0,0,.18)}

.head .t{padding-right:104px}

.printico .qn{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:#141210;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
